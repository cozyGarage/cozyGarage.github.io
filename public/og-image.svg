<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#0096c7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="530" r="200" fill="url(#accent)" opacity="0.1"/>
  <circle cx="1100" cy="100" r="150" fill="url(#accent)" opacity="0.1"/>
  
  <!-- Main content -->
  <text x="600" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff">
    Trung Nguyen
  </text>
  
  <text x="600" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="500" fill="url(#accent)">
    Full Stack Developer &amp; ML Enthusiast
  </text>
  
  <!-- Skills preview -->
  <text x="600" y="420" text-anchor="middle" font-family="monospace" font-size="24" fill="rgba(255,255,255,0.7)">
    React • TypeScript • Python • Machine Learning
  </text>
  
  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="rgba(255,255,255,0.5)">
    cozygarage.github.io
  </text>
</svg>
