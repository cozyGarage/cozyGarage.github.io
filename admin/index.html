<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="admin-header">
      <h1>📊 Portfolio Admin</h1>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="syncData()">🔄 Sync to Portfolio</button>
        <a href="http://localhost:5173" target="_blank" class="btn btn-secondary">👁️ View Site</a>
      </div>
    </header>

    <nav class="admin-nav">
      <button class="nav-btn active" data-tab="personal">👤 Personal Info</button>
      <button class="nav-btn" data-tab="projects">📁 Projects</button>
      <button class="nav-btn" data-tab="skills">🛠️ Skills</button>
      <button class="nav-btn" data-tab="experience">💼 Experience</button>
    </nav>

    <main class="admin-content">
      <!-- Personal Info Tab -->
      <section id="personal-tab" class="tab-content active">
        <h2>Personal Information</h2>
        <form id="personal-form" class="admin-form">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
          </div>
          <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="4"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
              <label for="location">Location</label>
              <input type="text" id="location" name="location">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="github">GitHub URL</label>
              <input type="url" id="github" name="github">
            </div>
            <div class="form-group">
              <label for="linkedin">LinkedIn URL</label>
              <input type="url" id="linkedin" name="linkedin">
            </div>
          </div>
          <button type="submit" class="btn btn-primary">💾 Save Personal Info</button>
        </form>
      </section>

      <!-- Projects Tab -->
      <section id="projects-tab" class="tab-content">
        <div class="tab-header">
          <h2>Projects</h2>
          <button class="btn btn-primary" onclick="showProjectModal()">➕ Add Project</button>
        </div>
        <div id="projects-list" class="items-grid"></div>
      </section>

      <!-- Skills Tab -->
      <section id="skills-tab" class="tab-content">
        <div class="tab-header">
          <h2>Skills</h2>
          <button class="btn btn-primary" onclick="showSkillModal()">➕ Add Skill</button>
        </div>
        <div id="skills-list" class="items-grid"></div>
      </section>

      <!-- Experience Tab -->
      <section id="experience-tab" class="tab-content">
        <div class="tab-header">
          <h2>Experience</h2>
          <button class="btn btn-primary" onclick="showExperienceModal()">➕ Add Experience</button>
        </div>
        <div id="experience-list" class="items-list"></div>
      </section>
    </main>

    <!-- Project Modal -->
    <div id="project-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="project-modal-title">Add Project</h3>
          <button class="close-btn" onclick="closeModal('project-modal')">&times;</button>
        </div>
        <form id="project-form" class="admin-form">
          <input type="hidden" id="project-id" name="id">
          <div class="form-row">
            <div class="form-group">
              <label for="project-title">Title *</label>
              <input type="text" id="project-title" name="title" required>
            </div>
            <div class="form-group">
              <label for="project-category">Category *</label>
              <select id="project-category" name="category" required>
                <option value="web">Web</option>
                <option value="game">Game</option>
                <option value="ml">ML/AI</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="project-description">Short Description *</label>
            <input type="text" id="project-description" name="description" required>
          </div>
          <div class="form-group">
            <label for="project-longDescription">Long Description</label>
            <textarea id="project-longDescription" name="longDescription" rows="4"></textarea>
          </div>
          <div class="form-group">
            <label for="project-technologies">Technologies (comma-separated) *</label>
            <input type="text" id="project-technologies" name="technologies" placeholder="React, TypeScript, Node.js" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="project-demoUrl">Demo URL</label>
              <input type="text" id="project-demoUrl" name="demoUrl" placeholder="/play or https://...">
            </div>
            <div class="form-group">
              <label for="project-githubUrl">GitHub URL</label>
              <input type="url" id="project-githubUrl" name="githubUrl">
            </div>
          </div>
          <div class="form-group">
            <label for="project-image">Project Image</label>
            <div class="image-upload">
              <input type="file" id="project-image-file" accept="image/*" onchange="uploadImage(this)">
              <input type="text" id="project-image" name="image" placeholder="/projects/my-project.png">
              <img id="project-image-preview" class="image-preview" style="display: none;">
            </div>
          </div>
          <div class="form-group checkbox-group">
            <label>
              <input type="checkbox" id="project-featured" name="featured">
              Featured Project
            </label>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal('project-modal')">Cancel</button>
            <button type="submit" class="btn btn-primary">💾 Save Project</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Skill Modal -->
    <div id="skill-modal" class="modal">
      <div class="modal-content modal-small">
        <div class="modal-header">
          <h3 id="skill-modal-title">Add Skill</h3>
          <button class="close-btn" onclick="closeModal('skill-modal')">&times;</button>
        </div>
        <form id="skill-form" class="admin-form">
          <input type="hidden" id="skill-original-name">
          <div class="form-group">
            <label for="skill-name">Skill Name *</label>
            <input type="text" id="skill-name" name="name" required>
          </div>
          <div class="form-group">
            <label for="skill-category">Category *</label>
            <select id="skill-category" name="category" required>
              <option value="frontend">Frontend</option>
              <option value="backend">Backend</option>
              <option value="ml">ML/AI</option>
              <option value="tools">Tools</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="skill-level">Level (1-5) *</label>
            <input type="range" id="skill-level" name="level" min="1" max="5" value="3">
            <span id="skill-level-display">3</span>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal('skill-modal')">Cancel</button>
            <button type="submit" class="btn btn-primary">💾 Save Skill</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Experience Modal -->
    <div id="experience-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="experience-modal-title">Add Experience</h3>
          <button class="close-btn" onclick="closeModal('experience-modal')">&times;</button>
        </div>
        <form id="experience-form" class="admin-form">
          <input type="hidden" id="experience-index">
          <div class="form-row">
            <div class="form-group">
              <label for="experience-title">Job Title *</label>
              <input type="text" id="experience-title" name="title" required>
            </div>
            <div class="form-group">
              <label for="experience-company">Company *</label>
              <input type="text" id="experience-company" name="company" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="experience-location">Location</label>
              <input type="text" id="experience-location" name="location">
            </div>
            <div class="form-group">
              <label for="experience-period">Period *</label>
              <input type="text" id="experience-period" name="period" placeholder="2023 - Present" required>
            </div>
          </div>
          <div class="form-group">
            <label for="experience-description">Description (one item per line)</label>
            <textarea id="experience-description" name="description" rows="4" placeholder="Developed web applications&#10;Led a team of 5 developers&#10;Implemented CI/CD pipelines"></textarea>
          </div>
          <div class="form-group">
            <label for="experience-technologies">Technologies (comma-separated)</label>
            <input type="text" id="experience-technologies" name="technologies" placeholder="React, TypeScript, AWS">
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal('experience-modal')">Cancel</button>
            <button type="submit" class="btn btn-primary">💾 Save Experience</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast notifications -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
